<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ierdna Games</title>
<meta name="description" content="Small, carefully made games by Ierdna Games.">
<link rel="icon" href="icon-192.png">
<style>
  :root { --paper: #f6efdd; --ink: #2b2620; --muted: #6b6255; --line: #ddd2bb; --pen: #2c4a9a; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1d1c1a; --ink: #ece6d8; --muted: #a59d8e; --line: #3a3630; --pen: #8fa8ec; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 18px; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  a.game { display: flex; align-items: center; gap: 16px; margin-top: 28px; padding: 14px; border: 1.5px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; }
  a.game img { width: 64px; height: 64px; border-radius: 14px; }
  a.game b { font-size: 20px; display: block; }
  footer { margin-top: 40px; font-size: 15px; } footer a { color: var(--pen); }
</style>
</head>
<body>
<main>
<h1>Ierdna Games</h1>
<p class="muted">Small, carefully made games. No ads, no tracking.</p>
<a class="game" href="sudoku/"><img src="icon-192.png" alt=""><span><b>The Last Sudoku</b><span class="muted">Sudoku that teaches you the tricks, in beautiful handmade themes.</span></span></a>
<footer><a href="mailto:games.ierdna@gmail.com">games.ierdna@gmail.com</a></footer>
</main>
</body>
</html>
